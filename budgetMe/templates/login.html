{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block head %}
<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-grow: 1;
        text-align: center;
        flex-direction: column;
    }

    .login-container h2 {
        color: #004d40;
        margin-bottom: 20px;
        font-size: 24px;
    }

    .login-container button {
        background-color: #00c853;
        color: #fff;
        padding: 15px 30px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-top: 20px;
        width: 100%;
        max-width: 300px;
    }

    .login-container button:hover {
        background-color: #004d40;
    }

    .login-container .signup {
        margin-top: 24px;
        font-size: 15px;
    }

    .login-container .signup a {
        color: #004d40;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <h2>Login with your Bank</h2>
    <p>Securely connect your bank account using Teller</p>
    <button type="button" onclick="openTellerConnect()">Open Bank Login</button>
    <p class="signup">New here? <a href="/createAccount">Create an account</a></p>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.teller.io/connect/connect.js"></script>
<script>
    const TELLER_APP_ID = '{{ teller_app_id }}';
    const TELLER_ENV = '{{ teller_env }}';

    const connectHandler = TellerConnect.setup({
        applicationId: TELLER_APP_ID,
        environment: TELLER_ENV,
        onSuccess: function (auth) {
            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ accessToken: auth.accessToken })
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data && data.redirect) {
                        window.location.href = data.redirect;
                    }
                })
                .catch(function (error) { console.error('Error:', error); });
        },
        onExit: function () { console.log('User exited Teller Connect'); },
        onError: function (error) { console.error('Error:', error); }
    });

    function openTellerConnect() {
        connectHandler.open();
    }
</script>
{% endblock %}
