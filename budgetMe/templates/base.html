<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BudgetMe{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <header>
        <a href="/" class="logo">BudgetMe</a>

        <div class="nav-buttons">
            <a href="/breakdown">My Breakdown</a>
            <a href="/analysis">Analysis</a>
            <a href="/advice">Financial Advice</a>
        </div>

        <div class="profile-button" onclick="toggleProfileDropdown()">U</div>
        <div class="profile-dropdown" id="profileDropdown">
            <a href="/account">Account</a>
            <a href="/settings">Settings</a>
            <a href="/logout">Log out</a>
        </div>
    </header>

    {% block content %}{% endblock %}

    <footer>
        <p>&copy; 2024 BudgetMe. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
