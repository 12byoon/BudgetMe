{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{# NOTE: the /createAccount route renders this, but there is no auth backend - the form submits nowhere useful. #}

{% block head %}
<style>
    main {
        padding: 40px;
        max-width: 600px;
        margin: 20px auto;
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        flex-grow: 1;
        text-align: center;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    input {
        padding: 10px;
        border: 1px solid #004d40;
        border-radius: 4px;
        font-size: 16px;
        width: 100%;
    }

    button {
        padding: 10px;
        background-color: #00c853;
        color: #004d40;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        font-weight: bold;
        transition: background-color 0.3s, color 0.3s;
    }

    button:hover {
        background-color: #004d40;
        color: #00c853;
    }
</style>
{% endblock %}

{% block content %}
<main>
    <h2>Create Account</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Create Account</button>
    </form>
</main>
{% endblock %}
