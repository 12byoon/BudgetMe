{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block head %}
<style>
    main {
        flex-grow: 1;
        width: 100%;
        max-width: 700px;
        margin: 20px auto;
        padding: 0 20px;
        display: flex;
        flex-direction: column;
        gap: 20px;
    }

    .card {
        background-color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
        padding: 40px;
    }

    .card h2 {
        color: #004d40;
        margin-bottom: 20px;
    }

    .profile-rows {
        display: flex;
        flex-direction: column;
    }

    .profile-row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
        padding: 14px 0;
        border-bottom: 1px solid #ddd;
    }

    .profile-row:last-child {
        border-bottom: none;
    }

    .profile-row .label {
        color: #004d40;
        font-weight: 500;
    }

    .profile-row .value {
        color: #333;
        text-align: right;
    }

    .card-actions {
        margin-top: 24px;
    }

    button {
        background-color: #00c853;
        color: #004d40;
        border: none;
        border-radius: 4px;
        padding: 10px 20px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s, color 0.3s;
    }

    button:hover:not(:disabled) {
        background-color: #004d40;
        color: #00c853;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .note {
        margin-top: 12px;
        font-size: 14px;
        color: #777;
    }
</style>
{% endblock %}

{% block content %}
<main>
    <div class="card">
        <h2>Account</h2>
        <div class="profile-rows">
            <div class="profile-row">
                <span class="label">Name</span>
                <span class="value">Jane Saver</span>
            </div>
            <div class="profile-row">
                <span class="label">Email</span>
                <span class="value">jane@example.com</span>
            </div>
            <div class="profile-row">
                <span class="label">Linked bank</span>
                <span class="value">Not connected</span>
            </div>
            <div class="profile-row">
                <span class="label">Member since</span>
                <span class="value">2024</span>
            </div>
        </div>
        <div class="card-actions">
            <button type="button" disabled>Edit profile</button>
            <p class="note">Profile editing isn't available yet.</p>
        </div>
    </div>
</main>
{% endblock %}
